[project]
name = "cite-or-silence"
version = "0.1.0"
description = "Philosophy Q&A grounded in the Stanford Encyclopedia of Philosophy: every sentence cited, every citation checked."
readme = "README.md"
authors = [
    { name = "Alejandro Borrego", email = "210245044+abp002@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
]

[project.scripts]
cite-or-silence = "cite_or_silence.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
