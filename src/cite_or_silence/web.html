<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cite-or-silence</title>
<link rel="icon" type="image/svg+xml" href="static/favicon.svg">
<style>
/* A reading room at night. The draft comes in faint ink, every sentence tied by a thread to the
   passage it cites. Checking pulls each thread: brass when the quote backs the sentence, which then
   inks in; red when it does not, and the sentence is struck. If nothing is left, the lamp goes out. */
:root {
  --night: #0f221c;
  --desk: #173229;
  --rule: #2a4b40;
  --sage: #8da399;
  --faded: #5f766c;
  --paper: #f1e8d6;
  --brass: #d9a646;
  --brass-glow: rgba(217, 166, 70, .3);
  --red: #e5573f;
  --red-text: #f2846e;
  --display: "Big Caslon", "Hoefler Text", Baskerville, Georgia, serif;
  --serif: "Hoefler Text", Baskerville, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.6, 0, .2, 1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { color-scheme: dark; font-size: clamp(15px, .55vw + 7.5px, 19px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  background: var(--night); color: var(--paper);
  font: 1rem/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(60rem 40rem at 22% -12%, rgba(217, 166, 70, .1), transparent 70%);
  transition: opacity 1.8s ease;
}
body.silent::before { opacity: 0; }
.instant, .instant * { transition: none !important; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.page { display: flex; flex-direction: column; min-height: 100vh; max-width: 80rem; margin: 0 auto; padding: 1.8rem 4rem 2rem; }
/* The logo stays small in the corner and names the page; the headline says what it promises. */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem 2rem; }
.nav { display: flex; align-items: center; gap: .9rem; font: 500 .92rem/1 var(--sans); }
.nav a { color: var(--sage); text-decoration: none; transition: color .2s; }
.nav a:hover { color: var(--paper); }
.nav .icon { display: grid; place-items: center; width: 1.9rem; height: 1.9rem; border-radius: 6px; }
.nav .icon svg { width: 1.2rem; height: 1.2rem; }
.langs { display: flex; padding: .15rem; border: 1px solid var(--rule); border-radius: 999px; }
.langs button {
  padding: .42rem .65rem; cursor: pointer; font: 600 .76rem/1 var(--sans); letter-spacing: .06em;
  color: var(--sage); background: none; border: 0; border-radius: 999px; transition: color .2s, background-color .2s;
}
.langs button:hover { color: var(--paper); }
.langs button[aria-pressed="true"] { color: var(--night); background: var(--brass); }
.brand { display: block; line-height: 0; border-radius: 6px; }
.brand img { width: auto; height: 3.6rem; }

.hero { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .8s var(--ease), opacity .45s ease; }
.hero > div { min-height: 0; overflow: hidden; text-align: center; }
.asked .hero { grid-template-rows: 0fr; opacity: 0; }
.hero h1 { margin: 13vh 0 0; font: 400 clamp(3.75rem, 7vw, 6.75rem)/.95 var(--display); letter-spacing: -.025em; }
.hero p { max-width: 37rem; margin: 1.5rem auto 0; font: 1.22rem/1.55 var(--serif); color: var(--sage); text-wrap: balance; }

/* The question field becomes the question's title once asked, centred in both, so it only has to
   grow and rise. Hoefler, not Big Caslon: Big Caslon's ¿ looks odd. */
.asker { position: relative; max-width: 48rem; margin: 2.6rem auto 0; transition: max-width .8s var(--ease), margin .8s var(--ease); }
.asked .asker { max-width: 72rem; margin-top: 1.6rem; }
.ask { position: relative; }
.ask textarea {
  display: block; width: 100%; margin: 0; resize: none; field-sizing: content;
  padding: 1.05rem 9.2rem; font: 1.75rem/1.2 var(--serif); color: var(--paper); text-align: center;
  background: var(--desk); border: 1px solid var(--rule); border-radius: 14px; outline: none;
  transition: font-size .8s var(--ease), padding .8s var(--ease), background-color .5s, border-color .3s, border-radius .8s;
}
.ask textarea::placeholder { color: var(--sage); opacity: 1; }
.ask textarea:focus { border-color: var(--brass); }
.ask button {
  position: absolute; top: .5rem; right: .5rem; bottom: .5rem; padding: 0 1.4rem; cursor: pointer;
  font: 600 1.02rem/1 var(--sans); color: var(--night);
  background: var(--brass); border: 0; border-radius: 10px;
  transition: filter .2s, opacity .3s;
}
.ask button:hover { filter: brightness(1.08); }
.asked .ask textarea {
  padding: 0 .2em .2rem; font-size: clamp(2.1rem, 3.4vw, 3.3rem);
  background: transparent; border-color: transparent; border-radius: 0;
}
.asked .ask textarea:focus { border-bottom-color: var(--brass); }
.asked .ask button { opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s .3s; }

.facts { margin: .7rem 0 0; font: .85rem/1.3 var(--sans); color: var(--sage); text-align: center; font-variant-numeric: tabular-nums; }
.asked .facts { display: none; }
.examples { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .55rem; margin-top: 1.15rem; font: .95rem/1.3 var(--sans); color: var(--sage); }
.examples .label { margin-right: .3rem; }
.example {
  padding: .5rem .95rem; cursor: pointer;
  font: 1.02rem/1.3 var(--serif); color: var(--paper); text-align: left;
  background: transparent; border: 1px solid var(--rule); border-radius: 999px;
  transition: border-color .2s, background-color .2s;
}
.example:hover { border-color: var(--brass); background: rgba(217, 166, 70, .1); }
.examples .keys { display: none; }
.asked .examples {
  position: absolute; z-index: 5; top: 100%; left: 50%; width: min(34rem, 100%);
  flex-direction: column; align-items: stretch; gap: .1rem;
  margin-top: .6rem; padding: .7rem;
  background: var(--desk); border: 1px solid var(--rule); border-radius: 14px;
  box-shadow: 0 1.5rem 3.5rem rgba(0, 0, 0, .5);
  opacity: 0; visibility: hidden; translate: -50% -.3rem;
}
.asked .asker:focus-within .examples { opacity: 1; visibility: visible; translate: -50% 0; transition: opacity .18s, translate .18s; }
.asked .examples .label { margin: 0 0 .3rem .6rem; }
.asked .example { padding: .55rem .6rem; border: 0; border-radius: 9px; }
.asked .examples .keys { display: block; margin: .5rem .6rem .1rem; font-size: .82rem; }

.run { transition: opacity .3s ease; }
.run.leaving { opacity: 0; }

.rail { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; row-gap: .4rem; margin: 1.5rem 0 0; padding: 0; list-style: none; font: 500 .95rem/1.3 var(--sans); color: var(--sage); animation: appear .5s ease both; }
.rail li { display: flex; align-items: center; transition: color .4s; }
.rail li + li::before {
  content: ""; width: 3rem; height: 1px; margin: 0 1.1rem;
  background: linear-gradient(var(--brass), var(--brass)) left / 0 100% no-repeat var(--rule);
  transition: background-size .6s var(--ease);
}
.rail li:not([data-state="waiting"])::before { background-size: 100% 100%; }
.rail .dot { flex: none; width: .62rem; height: .62rem; margin-right: .6rem; border: 1.5px solid currentColor; border-radius: 50%; transition: background-color .3s, border-color .3s; }
.rail li[data-state="active"], .rail li[data-state="done"] { color: var(--paper); }
.rail li[data-state="active"] .dot { border-color: var(--brass); background: var(--brass); animation: pulse 1.4s ease-out infinite; }
.rail li[data-state="done"] .dot { border-color: var(--brass); background: var(--brass); }
.rail li[data-state="failed"] .dot { border-color: var(--red); background: var(--red); }
.rail .detail { margin-left: .6rem; color: var(--sage); font-weight: 400; font-variant-numeric: tabular-nums; }
@keyframes pulse { from { box-shadow: 0 0 0 0 var(--brass-glow); } to { box-shadow: 0 0 0 .55rem transparent; } }
@keyframes appear { from { opacity: 0; } }

.narration { min-height: 1.55em; margin: .6rem 0 0; text-align: center; font: 1rem/1.55 var(--sans); color: var(--sage); transition: opacity .18s; }
.narration.swap { opacity: 0; }

.stage {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(19rem, 25rem);
  column-gap: clamp(4.5rem, 9vw, 9rem); align-items: start; margin-top: 2.4rem;
}
.stage > :not(svg) { position: relative; z-index: 1; }

/* Threads run from each sentence's citation to the passage it cites. */
.threads { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; transition: opacity 1.2s ease; }
.threads g { transition: opacity .35s ease; }
.threads path { fill: none; stroke-linecap: round; }
.threads .ghost { stroke: var(--sage); stroke-width: 1.3; stroke-dasharray: .5 5.5; opacity: 0; transition: opacity .6s ease; }
.threads .live { stroke: var(--brass); stroke-width: 1.8; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .65s var(--ease), stroke .25s ease, opacity .8s ease; }
.threads .end { fill: var(--sage); opacity: 0; transition: opacity .4s ease, fill .25s ease; }
.threads .drafted .ghost { opacity: .75; }
.threads .drafted .end { opacity: .8; }
.threads .pulled .live { stroke-dashoffset: 0; }
.threads .kept .ghost { opacity: 0; }
.threads .kept .end { fill: var(--brass); opacity: 1; }
.threads .cut .live { stroke: var(--red); opacity: 0; transition: stroke .2s ease, opacity .9s ease .8s; }
.threads .cut .ghost { opacity: .15; }
.threads .cut .end { fill: var(--red); opacity: .4; }
.stage.focus .threads g:not(.current) { opacity: .12; }
.settled .threads .kept .live { opacity: .75; }
.silent .threads { opacity: 0; }

.lines { display: grid; gap: 1.55rem; }
.line {
  display: grid; grid-template-columns: 2.5rem minmax(0, 1fr); outline-offset: .4rem;
  opacity: 0; filter: blur(.4rem); translate: 0 .4rem;
  transition: opacity .55s ease, filter .55s ease, translate .55s ease;
}
.line.shown { opacity: 1; filter: none; translate: 0 0; }
.stage.focus .line.shown:not(.current) { opacity: .28; }
.mark { width: 1.35rem; height: 1.35rem; margin-top: .62rem; color: var(--brass); }
.mark svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.mark path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .5s ease; }
.line[data-state="kept"] .mark path, .line[data-state="dropped"] .mark path { stroke-dashoffset: 0; }
.line[data-state="dropped"] .mark { color: var(--red); }
.line[data-state="dropped"] .mark path { transition-delay: .6s; }
.claim { margin: 0; font: 1.6rem/1.48 var(--serif); color: var(--sage); text-wrap: pretty; transition: color .7s ease; }
.claim .text { background: linear-gradient(var(--red), var(--red)) 0 60% / 0 .14rem no-repeat; transition: background-size .95s cubic-bezier(.65, 0, .35, 1); }
.claim .tail { white-space: nowrap; }
.line[data-state="kept"] .claim { color: var(--paper); }
.line[data-state="dropped"] .claim { color: var(--faded); transition: color .8s ease .9s; }
.line[data-state="dropped"] .claim .text { background-size: 100% .14rem; }
.chip {
  display: inline-grid; place-items: center; min-width: 1.5em; height: 1.5em; margin-left: .35em; padding: 0 .35em;
  vertical-align: .14em; font: 700 .5em/1 var(--sans); font-variant-numeric: tabular-nums;
  color: var(--sage); border: 1.5px solid currentColor; border-radius: 999px;
  transition: color .4s, background-color .4s, border-color .4s;
}
.line.current .chip { color: var(--brass); animation: pulse 1.4s ease-out infinite; }
.line[data-state="kept"] .chip { color: var(--night); background: var(--brass); border-color: var(--brass); animation: none; }
.line[data-state="dropped"] .chip { color: var(--red); border-color: var(--red); animation: none; }
.reason { margin: .5rem 0 0; font: 500 1rem/1.4 var(--sans); color: var(--red-text); opacity: 0; translate: 0 -.25rem; transition: opacity .45s ease .85s, translate .45s ease .85s; }
.line[data-state="dropped"] .reason { opacity: 1; translate: 0 0; }
.inline-quote { display: none; }
.stage.drafting .answer::before {
  content: ""; display: block; width: 2px; height: 1.95rem; margin: .4rem 0 0 2.5rem;
  background: var(--brass); animation: blink 1.1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.sources h2 { margin: 0 0 .75rem .55rem; font: 500 .9rem/1.3 var(--sans); color: var(--sage); }
.source-list { position: relative; margin: 0; padding: 0; list-style: none; }
.source {
  display: grid; grid-template-columns: 1.9rem minmax(0, 1fr);
  padding: .42rem .7rem .42rem .55rem; border-radius: 12px;
  transition: background-color .35s ease, opacity .5s ease;
  animation: arrive .5s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: calc(var(--i) * 60ms);
}
@keyframes arrive { from { opacity: 0; translate: 1rem 0; } }
.source .n { align-self: start; font: 600 .8rem/1.38rem var(--sans); color: var(--sage); font-variant-numeric: tabular-nums; transition: color .3s; }
.source .meta { min-width: 0; }
.source .title { display: block; overflow: hidden; font: 1.04rem/1.32 var(--serif); color: var(--paper); text-decoration: none; white-space: nowrap; text-overflow: ellipsis; }
.source .title:hover { text-decoration: underline 1px var(--brass); text-underline-offset: .2em; }
.source .where { display: block; overflow: hidden; font: .8rem/1.35 var(--sans); color: var(--sage); white-space: nowrap; text-overflow: ellipsis; }
.source .quote { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--ease); }
.source .quote > div { min-height: 0; overflow: hidden; }
.source blockquote { margin: 0; padding: .6rem 0 .25rem; font: italic 1.02rem/1.5 var(--serif); color: var(--paper); hyphens: auto; }
.source mark { color: inherit; background: linear-gradient(var(--brass-glow), var(--brass-glow)) 0 0 / 0 100% no-repeat; transition: background-size var(--sweep, 1s) cubic-bezier(.45, 0, .25, 1); }
.source.open { background: var(--desk); }
.source.open .quote { grid-template-rows: 1fr; }
.source.lit mark { background-size: 100% 100%; }
.source.missing mark { background: none; text-decoration: line-through 2px var(--red); }
.source.claimed .n { color: var(--paper); }
.source.cited .n { color: var(--brass); }
.stage.focus .source:not(.open) { opacity: .45; }
.settled .source:not(.cited) { opacity: .38; }
.settled .source.open { opacity: 1; }
.silent .sources { opacity: .3; transition: opacity 1.6s ease; }
.sources.reading .source-list::after {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3.2rem; border-radius: 12px; pointer-events: none;
  background: linear-gradient(transparent, rgba(217, 166, 70, .17), transparent);
  animation: scan 1.8s ease-in-out infinite alternate;
}
@keyframes scan { to { top: calc(100% - 3.2rem); } }

.silence { opacity: 0; translate: 0 .5rem; transition: opacity 1.3s ease .2s, translate 1.3s ease .2s; }
.silence.shown { opacity: 1; translate: 0 0; }
.lines:not(:empty) + .silence { margin-top: 2.6rem; }
.silence .verdict { margin: 0; font: clamp(2.6rem, 4.6vw, 4.4rem)/1.04 var(--display); letter-spacing: -.02em; }
.silence .why { max-width: 30rem; margin: 1.1rem 0 0; font: 1.2rem/1.55 var(--serif); color: var(--sage); }

.access { max-width: 34rem; margin: 2.6rem auto 0; text-align: center; animation: appear .5s ease both; }
.access p { margin: 0; font: 1.2rem/1.55 var(--serif); color: var(--sage); text-wrap: balance; }
.access .actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .8rem 1rem; margin-top: 1.4rem; }
.access a {
  display: inline-block; padding: .85rem 1.4rem;
  font: 600 1rem/1 var(--sans); color: var(--night); text-decoration: none;
  background: var(--brass); border-radius: 10px; transition: filter .2s;
}
.access a:hover { filter: brightness(1.08); }

/* The public demo cannot show the quotes; a video of the local page can. Nothing from YouTube loads
   until someone asks for it: the player is made on opening and thrown away on closing. */
.watch-row { margin: 1.8rem 0 0; text-align: center; }
.asked .watch-row { display: none; }
.watch {
  display: inline-flex; align-items: center; gap: .6rem; padding: .4rem 1.1rem .4rem .4rem; cursor: pointer;
  font: 500 .95rem/1 var(--sans); color: var(--paper);
  background: transparent; border: 1px solid var(--rule); border-radius: 999px;
  transition: border-color .2s, background-color .2s;
}
.watch:hover { border-color: var(--brass); background: rgba(217, 166, 70, .1); }
.watch .play { display: grid; place-items: center; width: 1.9rem; height: 1.9rem; border-radius: 50%; background: var(--brass); }
.watch .play svg { width: .95rem; height: .95rem; margin-left: .12rem; fill: var(--night); }
.watch .len { color: var(--sage); font-variant-numeric: tabular-nums; }
.watch .len::before { content: "·"; margin-right: .6rem; color: var(--faded); }
.video { width: min(92vw, 72rem, calc((100dvh - 7rem) * 16 / 9)); padding: 0; overflow: visible; color: var(--paper); background: none; border: 0; }
.video[open] { animation: rise .35s var(--ease) both; }
.video::backdrop { background: rgba(6, 15, 12, .86); backdrop-filter: blur(4px); animation: appear .3s ease both; }
.video .bar { display: flex; justify-content: flex-end; margin-bottom: .55rem; }
.video .close {
  display: grid; place-items: center; width: 2.2rem; height: 2.2rem; padding: 0; cursor: pointer;
  color: var(--sage); background: none; border: 0; border-radius: 6px; transition: color .2s;
}
.video .close:hover { color: var(--paper); }
.video .close svg { width: 1.3rem; height: 1.3rem; }
.video .frame { aspect-ratio: 16 / 9; overflow: hidden; background: #000; border-radius: 12px; box-shadow: 0 2rem 5rem rgba(0, 0, 0, .6); }
.video iframe { display: block; width: 100%; height: 100%; border: 0; }
@keyframes rise { from { opacity: 0; translate: 0 .8rem; } }

/* The public demo cannot show SEP text: an open passage offers the link to its section instead. */
.go { margin: 0; padding: .45rem 0 .2rem; font: .88rem/1.3 var(--sans); }
.go a { color: var(--brass); text-decoration: none; }
.go a:hover { text-decoration: underline; text-underline-offset: .2em; }
.public .inline-quote { display: none !important; }
.public .examples .keys { display: none; }

.foot {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: .4rem 2rem;
  margin-top: auto; padding-top: 4rem; font: .8rem/1.45 var(--sans); color: var(--faded);
}
.foot a { color: var(--sage); text-decoration: none; }
.foot a:hover { color: var(--paper); }

/* Under the hood: the numbers of this very search, folded away until asked for. */
.inside { margin-top: 4rem; border-top: 1px solid var(--rule); animation: appear .6s ease both; }
.inside summary {
  display: flex; align-items: center; gap: .6rem; padding: 1.1rem 0; cursor: pointer; list-style: none;
  font: 500 .95rem/1.3 var(--sans); color: var(--sage); transition: color .2s;
}
.inside summary::-webkit-details-marker { display: none; }
.inside summary::before { content: "+"; display: grid; place-items: center; width: 1.3rem; height: 1.3rem; font: 600 .9rem/1 var(--sans); color: var(--brass); border: 1.5px solid var(--rule); border-radius: 50%; transition: rotate .3s var(--ease); }
.inside[open] summary::before { rotate: 45deg; }
.inside summary:hover { color: var(--paper); }
.inside .lede { max-width: 44rem; margin: 0 0 1.8rem; font: 1.08rem/1.55 var(--serif); color: var(--sage); }
.funnel { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 1.4rem; margin: 0; padding: 0; list-style: none; }
.funnel li { padding-top: .8rem; border-top: 2px solid var(--brass); }
.funnel li + li { border-top-color: color-mix(in srgb, var(--brass) 55%, var(--rule)); }
.funnel .big { display: block; font: 400 2.5rem/1 var(--serif); color: var(--paper); font-variant-numeric: lining-nums tabular-nums; }
.funnel .what { display: block; margin-top: .45rem; font: .82rem/1.4 var(--sans); color: var(--sage); }
.funnel svg { display: block; width: 100%; height: 2.4rem; margin-top: .6rem; }
.funnel svg .up { fill: var(--brass); }
.funnel svg .down { fill: var(--sage); }
.inside h3 { margin: 2.6rem 0 .3rem; font: 500 .9rem/1.3 var(--sans); color: var(--paper); }
.inside .scale { margin: 0 0 .9rem; font: .8rem/1.4 var(--sans); color: var(--faded); }
.pool { margin: 0; padding: 0; list-style: none; font: .86rem/1.3 var(--sans); font-variant-numeric: tabular-nums; }
.pool li {
  display: grid; grid-template-columns: 2.2rem minmax(0, 1fr) minmax(5rem, 10rem) 3.2rem 12rem; align-items: center; gap: .9rem;
  padding: .32rem .5rem; border-radius: 8px;
}
.pool li:nth-child(odd) { background: rgba(23, 50, 41, .55); }
.pool .rank { color: var(--faded); }
.pool .what { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--paper); }
.pool .what a { font: 1rem/1.3 var(--serif); color: inherit; text-decoration: none; }
.pool .what a:hover { text-decoration: underline 1px var(--brass); text-underline-offset: .2em; }
.pool .what span { margin-left: .5rem; color: var(--sage); }
.pool .bar { height: .4rem; background: var(--rule); border-radius: 999px; overflow: hidden; }
.pool .bar i { display: block; height: 100%; background: var(--brass); border-radius: inherit; }
.pool .score { text-align: right; color: var(--sage); }
.pool .fate { font-size: .8rem; color: var(--sage); }
.pool [data-fate="kept"] .fate { color: var(--brass); font-weight: 600; }

function translate(next) {
  lang = next;

  document.documentElement.lang = lang;
  for (const node of document.querySelectorAll('[data-t]')) node.textContent = T[node.dataset.t];
  for (const node of document.querySelectorAll('[data-t-title]')) node.title = T[node.dataset.tTitle];

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;

function say(text) {

// The clock of a step shows how long the model really takes: it runs only while the step's result
// has not arrived, so a saved answer replays without one.
function step(name, state, detail = '') {
  clearInterval(clock);
  ticking = null;
  const li = rail.querySelector(`[data-step="${name}"]`);
  const out = li.querySelector('.detail');
  li.dataset.state = state;
  out.textContent = detail;
  if (state !== 'active') return;
  out.textContent = `${T.working[name]}…`;
  if (arrived.has(ENDS[name])) return;
  const started = Date.now();
  const tick = () => { out.textContent = `${T.working[name]}… ${Math.floor((Date.now() - started) / 1000)} s`; };
  tick();
  clock = setInterval(tick, 1000);
  ticking = name;
}

function where(p) {
  if (!p.heading) return T.intro;
  return p.section ? `§${p.section} ${p.heading}` : p.heading;

function sourceItem(p, n, repeated) {
  const li = el('li', 'source');
  li.id = `source-${n}`;

  title.href = p.url;
  title.target = '_blank';
  title.rel = 'noreferrer';
  const quote = el('div', 'quote');
  const inner = el('div');
  if (PUBLIC) {

    link.href = p.url;
    link.target = '_blank';
    link.rel = 'noreferrer';
    go.append(link);
    inner.append(go);
  } else {

    said.lang = 'en';
    inner.append(said);
  }

  const meta = el('div', 'meta');
  meta.append(title, el('span', 'where', where(p) + (repeated ? T.another : '')), quote);

  line.dataset.state = 'draft';
  const mark = el('span', 'mark');
  mark.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"></svg>';
  // The last word travels with the citation, so the chip never sits alone on a line.
  const cut = s.text.trimEnd().lastIndexOf(' ');
  const text = el('span', 'text', s.text.slice(0, cut + 1));
  const tail = el('span', 'tail', s.text.slice(cut + 1));
  const chip = el('span', 'chip', String(s.source));
  chip.title = T.cites(s.source);
  tail.append(chip);
  text.append(tail);
  const claim = el('p', 'claim');
  claim.append(text, el('span', 'sr-only state'));
  const reason = el('p', 'reason');
  reason.hidden = true;
  const quote = el('div', 'inline-quote');
  const inner = el('div');
  if (s.quote) {
    const said = el('blockquote', '', `“${s.quote}”`);
    said.lang = 'en';
    inner.append(said);
  }
  quote.append(inner);
  const main = el('div');
  main.append(claim, reason, quote);
  line.append(mark, main);
  const show = () => { if (settled && !body.classList.contains('silent')) spotlight(i, false); };
  const hide = () => { if (settled) unspotlight(); };
  line.addEventListener('mouseenter', show);
  line.addEventListener('mouseleave', hide);
  line.addEventListener('focus', show);
  line.addEventListener('blur', hide);
  return line;
}

function tie(i) {
  const line = lines.children[i], row = $(`source-${drafted[i].source}`);
  if (!row) return { line, row: null, g: null };
  const make = (tag, className) => {
    const node = document.createElementNS(NS, tag);
    node.setAttribute('class', className);
    return node;
  };
  const g = make('g', ''), ghost = make('path', 'ghost'), live = make('path', 'live'), end = make('circle', 'end');
  live.setAttribute('pathLength', '1');
  end.setAttribute('r', '3.2');
  g.append(ghost, live, end);
  threads.append(g);
  return { line, row, g, ghost, live, end, chip: line.querySelector('.chip'), n: row.querySelector('.n') };
}

// Every frame, because rows open and close and sentences reflow under the threads.
function layoutThreads() {
  if (!ties.length || narrow.matches || stage.hidden) return;
  const box = stage.getBoundingClientRect(), gutter = lines.getBoundingClientRect().right - box.left + 14;
  for (const t of ties) {
    if (!t.g) continue;
    const a = t.chip.getBoundingClientRect(), b = t.n.getBoundingClientRect();
    const x1 = a.right - box.left + 5, y1 = a.top + a.height / 2 - box.top;
    const x2 = t.row.getBoundingClientRect().left - box.left - 6, y2 = b.top + b.height / 2 - box.top;
    // Straight along the sentence's last line, which is empty past the citation, then curve in the gutter.
    const xg = Math.max(x1, gutter), k = (x2 - xg) / 2;
    const d = `M${x1.toFixed(1)} ${y1.toFixed(1)}H${xg.toFixed(1)}C${(xg + k).toFixed(1)} ${y1.toFixed(1)} ${(x2 - k).toFixed(1)} ${y2.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
    if (d === t.d) continue;
    t.d = d;
    t.ghost.setAttribute('d', d);
    t.live.setAttribute('d', d);
    t.end.setAttribute('cx', x2.toFixed(1));
    t.end.setAttribute('cy', y2.toFixed(1));
  }
}
(function frame() { layoutThreads(); requestAnimationFrame(frame); })();

function sweepOf(i) { return Math.min(1500, 350 + (drafted[i].quote || '').length * 3); }

function spotlight(i, sweep = true) {
  const t = ties[i];
  stage.classList.add('focus');
  t.line.classList.add('current');
  t.g?.classList.add('current');
  if (!t.row) return;
  t.row.querySelector('blockquote')?.replaceChildren('“', el('mark', '', drafted[i].quote), '”');
  t.row.style.setProperty('--sweep', `${sweepOf(i)}ms`);
  t.row.classList.toggle('missing', verdicts[i] === 'quote not found in the cited passage');
  t.row.classList.add('open');
  if (!sweep) t.row.classList.add('lit');
}

function unspotlight() {
  stage.classList.remove('focus');
  for (const t of ties) {
    t.line.classList.remove('current');
    t.g?.classList.remove('current');
    t.row?.classList.remove('open', 'lit', 'missing');
  }
}

function decide(i, why) {
  const t = ties[i], said = why ? (T.reasons[why] || why) : '';
  verdicts[i] = why;
  t.line.querySelector('.mark svg').innerHTML = why ? CROSS : CHECK;
  t.line.querySelector('.state').textContent = why ? T.struckState + said : T.backedState;
  const reason = t.line.querySelector('.reason');
  reason.textContent = said;
  reason.hidden = !why;
  void t.line.offsetWidth;  // lay the mark and reason out first, so they animate in
  t.line.dataset.state = why ? 'dropped' : 'kept';
  t.g?.classList.add(why ? 'cut' : 'kept');
  if (why === 'quote not found in the cited passage') t.row?.classList.add('missing');
}

// The vector's first values as bars around a midline: brass above zero, sage below.
function sparkline(values) {
  const svg = document.createElementNS(NS, 'svg'), w = 4, h = 40, top = Math.max(...values.map(Math.abs)) || 1;
  svg.setAttribute('viewBox', `0 0 ${values.length * w} ${h}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('aria-hidden', 'true');
  for (const [i, v] of values.entries()) {
    const bar = document.createElementNS(NS, 'rect'), size = Math.max(.6, Math.abs(v) / top * (h / 2 - 1));
    bar.setAttribute('class', v >= 0 ? 'up' : 'down');
    bar.setAttribute('x', i * w + .6);
    bar.setAttribute('width', w - 1.2);
    bar.setAttribute('y', v >= 0 ? h / 2 - size : h / 2);
    bar.setAttribute('height', size);
    svg.append(bar);
  }
  return svg;
}

function showInside() {
  if (!searched) return;  // answers saved before the page showed the search
  const { candidates, cap, dims, head } = searched;
  const kept = candidates.filter((c) => c.fate === 'kept').length;
  const backed = verdicts.filter((why) => !why).length;
  const fact = (n, what, extra) => {
    const li = el('li');
    li.append(el('span', 'big', fmt(n)), el('span', 'what', what));
    if (extra) li.append(extra);
    return li;
  };
  $('funnel').replaceChildren(
    fact(dims, T.fVector, sparkline(head)),
    fact(candidates.length, T.fPool(TOTAL)),
    fact(kept, T.fKept(cap)),
    fact(drafted.length, T.fDrafted),
    fact(backed, T.fBacked),
  );
  const scores = candidates.map((c) => c.score), lo = Math.min(...scores), hi = Math.max(...scores);
  const num = (x) => x.toLocaleString(lang === 'es' ? 'es-ES' : 'en-GB', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
  $('pool-title').textContent = T.poolTitle(candidates.length);
  $('pool-scale').textContent = T.poolScale(num(lo), num(hi));
  let n = 0;
  $('pool').replaceChildren(...candidates.map((c, i) => {
    const li = el('li');
    li.dataset.fate = c.fate;
    const what = el('span', 'what'), title = el('a', '', c.title);
    title.href = c.url;
    title.target = '_blank';
    title.rel = 'noreferrer';
    what.append(title, el('span', '', where(c)));
    const bar = el('span', 'bar'), fill = el('i');
    fill.style.width = `${hi > lo ? 8 + 92 * (c.score - lo) / (hi - lo) : 100}%`;
    bar.append(fill);
    const fate = c.fate === 'kept' ? T.fates.kept(++n) : c.fate === 'capped' ? T.fates.capped(cap) : T.fates.spare;
    li.append(el('span', 'rank', String(i + 1)), what, bar, el('span', 'score', num(c.score)), el('span', 'fate', fate));
    return li;
  }));
  $('inside').hidden = false;
}

function clearStage() {
  clearInterval(clock);
  saying++;
  for (const li of rail.children) {
    li.dataset.state = 'waiting';
    li.querySelector('.detail').textContent = '';
  }
  rail.hidden = true;
  narration.textContent = '';
  narration.classList.remove('swap');
  stage.hidden = true;
  stage.classList.remove('focus', 'drafting');
  threads.replaceChildren();
  lines.replaceChildren();
  sourceList.replaceChildren();
  sources.hidden = true;
  sources.classList.remove('reading');
  silence.hidden = true;
  silence.classList.remove('shown');
  failure.hidden = true;
  access.hidden = true;
  $('inside').hidden = true;
  searched = null;
  runBox.classList.remove('leaving');
  body.classList.remove('silent', 'settled');
  drafted = [];
  ties = [];
  verdicts = [];
  settled = false;
}

function fail(message) {
  const active = rail.querySelector('[data-state="active"]');
  if (active) step(active.dataset.step, 'failed', T.failed);
  sources.classList.remove('reading');
  stage.classList.remove('drafting');
  say('');
  failure.textContent = T.failure(message);
  failure.hidden = false;
}

function ask(text, fresh) {
  const asked = text.trim().replace(/\s+/g, ' ');
  if (!asked) return;
  const id = ++run;
  const pause = async (ms) => {
    await sleep(ms);
    if (id !== run) throw STALE;
  };
  if (source) source.close();
  input.value = asked;
  input.blur();
  history.replaceState(null, '', `?q=${encodeURIComponent(asked)}`);
  const first = !body.classList.contains('asked');
  body.classList.add('asked');
  if (!first) runBox.classList.add('leaving');

  let started = 0, passages = [];
  if (PUBLIC && !ANSWERS[asked]) {  // the public demo only has the example answers
    queue = pause(first ? PACE.collapse : 300).then(() => {
      clearStage();
      access.hidden = false;
    }).catch(ignoreStale);
    return;
  }
  queue = pause(first ? PACE.collapse : 300).then(() => {
    clearStage();
    rail.hidden = false;
    step('search', 'active');
    say(T.searching(TOTAL));
    started = performance.now();
  }).catch(ignoreStale);

  arrived = new Set();
  const handlers = {};
  const on = (name, handle) => { handlers[name] = handle; };
  const deliver = (name, data) => {
    arrived.add(name);
    if (ticking && ENDS[ticking] === name) clearInterval(clock);
    queue = queue.then(() => (id === run ? handlers[name](data) : undefined)).catch(ignoreStale);
  };

  on('pool', (d) => { searched = d; });

  on('passages', async (d) => {
    await pause(started + PACE.search - performance.now());
    passages = d.passages;
    sourceList.replaceChildren(...passages.map((p, i) => sourceItem(p, i + 1, passages.slice(0, i).some((q) => q.url === p.url))));
    stage.hidden = false;
    sources.hidden = false;
    step('search', 'done', count(passages.length, T.passage));
    step('draft', 'active');
    say(T.drafting(passages.length));
    await pause(passages.length * 60 + 400);
    sources.classList.add('reading');
    stage.classList.add('drafting');
    await pause(PACE.read);
  });

  on('draft', async (d) => {
    drafted = d.sentences;
    sources.classList.remove('reading');
    stage.classList.remove('drafting');
    if (!drafted.length) {
      step('draft', 'done', T.noSentence);
      step('verify', 'done', T.nothingToCheck);
      say('');
      await pause(PACE.hush);
      return;
    }
    step('draft', 'done', count(drafted.length, T.sentence));
    lines.replaceChildren(...drafted.map(lineItem));
    ties = drafted.map((s, i) => tie(i));
    step('verify', 'active');
    say(T.checking);
    for (const line of lines.children) {
      line.classList.add('shown');
      await pause(PACE.line);
    }
    for (const t of ties) {
      t.g?.classList.add('drafted');
      t.row?.classList.add('claimed');
    }
    await pause(PACE.drafted);
  });

  on('verdicts', async (d) => {
    for (const [i, why] of d.dropped.entries()) {
      spotlight(i);
      await pause(PACE.open);
      ties[i].g?.classList.add('pulled');
      ties[i].row?.classList.add('lit');
      await pause(ties[i].row ? Math.max(PACE.decide, sweepOf(i) + 150) : PACE.decide);
      decide(i, why);
      await pause(why ? PACE.dropped : PACE.kept);
      unspotlight();
      await pause(PACE.close);
    }
    const kept = d.dropped.filter((why) => !why).length, struck = d.dropped.length - kept;
    const parts = [kept && count(kept, T.backed), struck && count(struck, T.struck)];
    step('verify', 'done', parts.filter(Boolean).join(', ') || T.nothingToCheck);
  });

  on('done', async (d) => {
    settled = true;
    body.classList.add('settled');
    for (const t of ties) {
      if (t.line.dataset.state === 'kept') t.row?.classList.add('cited');
      t.line.tabIndex = 0;
    }
    if (!d.silent) {
      say(verdicts.some(Boolean) ? T.settledStruck : T.settledAll);
      showInside();
      return;
    }
    silenceWhy.textContent = drafted.length ? T.allStruck : T.nothingFound(passages.length);
    body.classList.add('silent');
    await pause(PACE.hush);
    silence.hidden = false;
    void silence.offsetWidth;
    silence.classList.add('shown');
    showInside();
  });

  on('failed', (d) => fail(d.message));

  if (PUBLIC) {
    for (const [name, data] of ANSWERS[asked]) deliver(name, data);
    return;
  }
  source = new EventSource(`ask?q=${encodeURIComponent(asked)}${fresh ? '&fresh=1' : ''}`);
  for (const name of Object.keys(handlers)) source.addEventListener(name, (e) => {
    if (name === 'done' || name === 'failed') source.close();  // otherwise EventSource reconnects and asks again
    deliver(name, JSON.parse(e.data));
  });
  source.addEventListener('error', () => {
    if (id !== run || source.readyState === EventSource.CLOSED) return;
    source.close();
    queue = queue.then(() => fail(T.cutOff));
  });
}

function reset() {
  run++;
  if (source) source.close();
  queue = Promise.resolve();
  clearStage();
  body.classList.remove('asked');
  input.value = '';
  history.replaceState(null, '', location.pathname);
  input.focus();
}

// Shift+Enter or Shift+click asks the model again instead of replaying the saved answer.
addEventListener('keydown', (e) => { again = e.shiftKey; }, true);
addEventListener('pointerdown', (e) => { again = e.shiftKey; }, true);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.isComposing) {
    e.preventDefault();
    ask(input.value, e.shiftKey);
  } else if (e.key === 'Escape') {
    input.blur();
  }
});
form.addEventListener('submit', (e) => { e.preventDefault(); ask(input.value, again); });
for (const b of document.querySelectorAll('[data-lang]')) b.addEventListener('click', () => translate(b.dataset.lang));
$('home').addEventListener('click', (e) => { e.preventDefault(); reset(); });

// Nothing from YouTube loads until the video is asked for; closing throws the player away, which stops it.
const video = $('video'), videoFrame = $('video-frame');
function openVideo() {
  const player = el('iframe');
  player.src = `https://www.youtube-nocookie.com/embed/${VIDEOS[lang]}?autoplay=1&rel=0&playsinline=1&hl=${lang}`;
  player.title = T.videoTitle;
  player.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  player.allowFullscreen = true;
  player.referrerPolicy = 'strict-origin-when-cross-origin';
  videoFrame.replaceChildren(player);
  video.showModal();
}
for (const b of document.querySelectorAll('[data-video]')) b.addEventListener('click', openVideo);
$('video-close').addEventListener('click', () => video.close());
video.addEventListener('click', (e) => { if (e.target === video) video.close(); });  // on the backdrop
video.addEventListener('close', () => videoFrame.replaceChildren());

async function start() {
  if (PUBLIC) {
    body.classList.add('public');
    try { ANSWERS = await (await fetch('answers.json')).json(); } catch {}
  }
  const params = new URLSearchParams(location.search);
  if (params.get('q')) {
    body.classList.add('asked', 'instant');
    requestAnimationFrame(() => requestAnimationFrame(() => body.classList.remove('instant')));
    ask(params.get('q'), params.has('fresh'));
  } else {
    input.focus();
  }
}
translate(lang);
start();
</script>
</body>
</html>
